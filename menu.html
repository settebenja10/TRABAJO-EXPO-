<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encabezado con Cámaras Grandes</title>
  <style>
    /* ======== ESTILOS GENERALES ======== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
    }

    /* ======== ENCABEZADO ======== */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255,255,255,0.2);
    }

    /* LOGO */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .logo svg {
      width: 50px;
      height: 50px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    /* ======== ÍCONOS DE CÁMARAS ======== */
    .iconos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 50px;
    }

    .icono {
      text-align: center;
      font-size: 15px;
    }

    .icono a {
      text-decoration: none;
      color: white;
    }

    .icono svg {
      width: 100px;   /* 📏 tamaño aumentado */
      height: 100px;  /* 📏 tamaño aumentado */
      stroke: white;
      stroke-width: 2.5;
      fill: none;
      transform: rotateX(25deg) rotateY(25deg);
      transition: transform 0.3s ease, stroke 0.3s;
    }

    .icono:hover svg {
      transform: rotateX(25deg) rotateY(25deg) scale(1.15);
      stroke: #ffea00;
    }

    /* ======== SECCIÓN JUEGOS ======== */
    .juegos {
      text-align: center;
      margin-top: 100px;
    }

    .juegos h2 {
      font-size: 36px;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .juego-icono {
      display: inline-block;
      cursor: pointer;
    }

    .juego-icono svg {
      width: 90px;
      height: 90px;
      stroke: white;
      stroke-width: 2;
      fill: none;
      transition: transform 0.3s ease, stroke 0.3s;
    }

    .juego-icono:hover svg {
      transform: scale(1.25);
      stroke: #ffea00;
    }
  </style>
</head>
<body>

  <!-- ======== ENCABEZADO ======== -->
  <header>
    <!-- 💡 LOGO -->
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8"></circle>
        <path d="M12 4v8l4 2"></path>
      </svg>
      <h1>Mi Logo</h1>
    </div>

    <!-- 💡 ÍCONOS DE CÁMARAS -->
    <div class="iconos">
      <div class="icono"><a href="#cam1">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="12" rx="2"></rect>
          <circle cx="12" cy="13" r="3"></circle>
        </svg>
        <p>Cámara 1</p></a>
      </div>

      <div class="icono"><a href="#cam2">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="12" rx="2"></rect>
          <circle cx="12" cy="13" r="3"></circle>
        </svg>
        <p>Cámara 2</p></a>
      </div>

      <div class="icono"><a href="#cam3">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="12" rx="2"></rect>
          <circle cx="12" cy="13" r="3"></circle>
        </svg>
        <p>Cámara 3</p></a>
      </div>

      <div class="icono"><a href="#cam4">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="12" rx="2"></rect>
          <circle cx="12" cy="13" r="3"></circle>
        </svg>
        <p>Cámara 4</p></a>
      </div>

      <div class="icono"><a href="#cam5">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="12" rx="2"></rect>
          <circle cx="12" cy="13" r="3"></circle>
        </svg>
        <p>Cámara 5</p></a>
      </div>

      <div class="icono"><a href="#cam6">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="12" rx="2"></rect>
          <circle cx="12" cy="13" r="3"></circle>
        </svg>
        <p>Cámara 6</p></a>
      </div>
    </div>
  </header>

  <!-- ======== SECCIÓN JUEGOS ======== -->
  <section class="juegos">
    <h2>Juegos</h2>
    <a href="#juego" class="juego-icono">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="6" width="20" height="12" rx="3"></rect>
        <circle cx="8" cy="12" r="2"></circle>
        <circle cx="16" cy="12" r="2"></circle>
      </svg>
    </a>
  </section>

</body>
</html>
